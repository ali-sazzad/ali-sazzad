<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030A06"/><stop offset="1" stop-color="#08170F"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2EBD74"><animate attributeName="stop-color" values="#2EBD74;#1A9E7C;#6FAE3B;#2EBD74" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="0.5" stop-color="#1A9E7C"><animate attributeName="stop-color" values="#1A9E7C;#6FAE3B;#2EBD74;#1A9E7C" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#6FAE3B"><animate attributeName="stop-color" values="#6FAE3B;#2EBD74;#1A9E7C;#6FAE3B" dur="9s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".09"/></pattern>
  <clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <ellipse cx="220" cy="110" rx="230" ry="120" fill="#2EBD74" fill-opacity=".55"><animateTransform attributeName="transform" type="translate" values="0 0;180 40;60 -20;0 0" dur="16s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="640" cy="300" rx="260" ry="110" fill="#1A9E7C" fill-opacity=".6"><animateTransform attributeName="transform" type="translate" values="0 0;-160 -50;120 -20;0 0" dur="19s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1030" cy="90" rx="220" ry="120" fill="#6FAE3B" fill-opacity=".45"><animateTransform attributeName="transform" type="translate" values="0 0;-140 60;40 90;0 0" dur="14s" repeatCount="indefinite"/></ellipse>
  </g>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <g transform="translate(1040 170)" fill="none" stroke="#fff" stroke-opacity=".18">
    <circle r="62"/><circle r="104" stroke-dasharray="3 9"/><circle r="146" stroke-opacity=".1"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/><circle cx="104" cy="0" r="7" fill="#2EBD74" stroke="none"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="34s" repeatCount="indefinite"/><circle cx="146" cy="0" r="6" fill="#6FAE3B" stroke="none"/><circle cx="-62" cy="0" r="4" fill="#B5D86A" stroke="none"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/><circle cx="62" cy="0" r="5" fill="#1A9E7C" stroke="none"/></g>
  </g>
  <text x="70" y="82" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="17" fill="#2EBD74" letter-spacing="3">&lt;hello world/&gt;</text>
  <text x="66" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="104" fill="url(#name)" letter-spacing="-2">Sazzad Ali</text>
  <text x="70" y="232" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="25" fill="#EAFFF3" letter-spacing="6">DESIGNER<tspan fill="#6FAE3B"> ✦ </tspan>PROGRAMMER<tspan fill="#B5D86A"> ✦ </tspan>DEVELOPER</text>
  <g transform="translate(70 262)">
    <rect width="266" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#2EBD74" stroke-opacity=".5"/>
    <circle cx="22" cy="19" r="5" fill="#2EBD74"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="38" y="25" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#EAFFF3">Open to work · Australia 🇦🇺</text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
</svg>