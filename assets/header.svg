<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06100B"/><stop offset="1" stop-color="#0B1B14"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5CFFA8"><animate attributeName="stop-color" values="#5CFFA8;#22D3B8;#B6FF5C;#5CFFA8" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="0.5" stop-color="#22D3B8"><animate attributeName="stop-color" values="#22D3B8;#B6FF5C;#5CFFA8;#22D3B8" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#B6FF5C"><animate attributeName="stop-color" values="#B6FF5C;#5CFFA8;#22D3B8;#B6FF5C" dur="9s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".09"/></pattern>
  <clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <ellipse cx="220" cy="110" rx="230" ry="120" fill="#5CFFA8" fill-opacity=".38"><animateTransform attributeName="transform" type="translate" values="0 0;180 40;60 -20;0 0" dur="16s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="640" cy="300" rx="260" ry="110" fill="#22D3B8" fill-opacity=".42"><animateTransform attributeName="transform" type="translate" values="0 0;-160 -50;120 -20;0 0" dur="19s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1030" cy="90" rx="220" ry="120" fill="#B6FF5C" fill-opacity=".34"><animateTransform attributeName="transform" type="translate" values="0 0;-140 60;40 90;0 0" dur="14s" repeatCount="indefinite"/></ellipse>
  </g>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <g transform="translate(1040 170)" fill="none" stroke="#fff" stroke-opacity=".18">
    <circle r="62"/><circle r="104" stroke-dasharray="3 9"/><circle r="146" stroke-opacity=".1"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/><circle cx="104" cy="0" r="7" fill="#5CFFA8" stroke="none"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="34s" repeatCount="indefinite"/><circle cx="146" cy="0" r="6" fill="#B6FF5C" stroke="none"/><circle cx="-62" cy="0" r="4" fill="#E6FF8A" stroke="none"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/><circle cx="62" cy="0" r="5" fill="#22D3B8" stroke="none"/></g>
  </g>
  <text x="70" y="82" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="17" fill="#5CFFA8" letter-spacing="3">&lt;hello world/&gt;</text>
  <text x="66" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="104" fill="url(#name)" letter-spacing="-2">Sazzad Ali</text>
  <text x="70" y="232" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="25" fill="#EAFFF3" letter-spacing="6">DESIGNER<tspan fill="#B6FF5C"> ✦ </tspan>PROGRAMMER<tspan fill="#E6FF8A"> ✦ </tspan>DEVELOPER</text>
  <g transform="translate(70 262)">
    <rect width="266" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#5CFFA8" stroke-opacity=".5"/>
    <circle cx="22" cy="19" r="5" fill="#5CFFA8"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="38" y="25" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#EAFFF3">Open to work · Australia 🇦🇺</text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
</svg>